<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Bandeja de seguimiento clínico" />
    <title>Seguimiento clínico</title>
    <script>
      // Resolve the theme before first paint to avoid a light flash in dark mode.
      (function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          var stored = window.localStorage.getItem('inbox-theme');
          if (stored === 'dark' || stored === 'light') dark = stored === 'dark';
        } catch (error) {
          // Storage can be blocked; the system preference still applies.
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
