<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Clinical follow-up inbox" />
    <!-- The UI language until the viewer picks one; a hosted deployment sets it (DEFAULT_UI_LOCALE). -->
    <meta name="inbox-default-locale" content="en" />
    <title>Clinical follow-up</title>
    <script>
      // Resolve the theme before first paint to avoid a light flash in dark mode.
      (function () {
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        try {
          var stored = window.localStorage.getItem('inbox-theme');
          if (stored === 'dark' || stored === 'light') dark = stored === 'dark';
        } catch (error) {
          // Storage can be blocked; the system preference still applies.
        }
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        // The remembered UI language, else the deployment's default (src/i18n/locale.ts), before first paint.
        var locale = null;
        try {
          locale = window.localStorage.getItem('inbox-locale');
        } catch (error) {
          // Storage can be blocked; the default applies.
        }
        if (locale !== 'en' && locale !== 'es') {
          var meta = document.querySelector('meta[name="inbox-default-locale"]');
          locale = meta && meta.getAttribute('content');
        }
        if (locale === 'en' || locale === 'es') document.documentElement.lang = locale;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
